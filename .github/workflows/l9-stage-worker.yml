name: l9-stage-worker

on:
  workflow_dispatch:
    inputs:
      dispatch_packet_b64:
        description: Base64-encoded signed l9.stage-dispatch/1.0.0 TransportPacket
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  compile-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted worker authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check --only-binary :all: uv==0.10.0

      - name: Build trusted preflight environment from lockfile
        run: |
          UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/l9-trusted-worker-env" \
            uv sync --frozen --no-build --no-dev --no-editable

      - name: Decode dispatch packet without using its fields
        env:
          DISPATCH_PACKET_B64: ${{ inputs.dispatch_packet_b64 }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          raw = base64.b64decode(os.environ["DISPATCH_PACKET_B64"], validate=True)
          Path("/tmp/l9-stage-dispatch.json").write_bytes(raw)
          PY

      - name: Verify signature and resolve exact revision
        id: dispatch
        env:
          L9_DISPATCH_HMAC_KEY: ${{ secrets.L9_DISPATCH_HMAC_KEY }}
        run: |
          preflight="$(${RUNNER_TEMP}/l9-trusted-worker-env/bin/l9-topology-worker \
            --dispatch-file /tmp/l9-stage-dispatch.json \
            --repo-root . \
            --workspace "${RUNNER_TEMP}/l9-topology-worker-preflight" \
            --preflight)"
          PREFLIGHT_JSON="$preflight" python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(os.environ["PREFLIGHT_JSON"])
          if result.get("status") != "passed":
              raise SystemExit("dispatch preflight did not pass")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"revision={result['target_revision']}\n")
              handle.write(f"uses_ghcr={'true' if result['uses_ghcr'] else 'false'}\n")
          PY

      - name: Checkout exact signed target revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.dispatch.outputs.revision }}
          fetch-depth: 1
          clean: true

      - name: Build exact-revision worker environment from lockfile
        run: |
          UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/l9-exact-worker-env" \
            uv sync --frozen --no-build --no-dev --no-editable

      - name: Install ORAS 1.3.0
        if: steps.dispatch.outputs.uses_ghcr == 'true'
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with:
          version: 1.3.0

      - name: Authenticate to GHCR
        if: steps.dispatch.outputs.uses_ghcr == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Execute exact validated stage
        env:
          L9_DISPATCH_HMAC_KEY: ${{ secrets.L9_DISPATCH_HMAC_KEY }}
          L9_RESULT_HMAC_KEY_ID: ${{ vars.L9_RESULT_HMAC_KEY_ID || 'foundational-hmac-v1' }}
          L9_CONTROL_API_URL: ${{ vars.L9_CONTROL_API_URL }}
          L9_CALLBACK_TOKEN: ${{ secrets.L9_CALLBACK_TOKEN }}
          L9_PACKET_REGISTRY_FILE: ${{ runner.temp }}/l9-topology-worker/packet-registry.sqlite3
          # Audit F-03: a fresh hosted runner has a fresh local store, so a local lease
          # cannot suppress cross-run replay. Production requires the authoritative
          # (external Postgres) control-plane lease and fails closed when it is
          # unavailable — it never silently falls back to the runner-local backend.
          L9_EXECUTION_AUTHORITY_MODE: ${{ vars.L9_EXECUTION_AUTHORITY_MODE || 'control-plane' }}
        run: |
          ${RUNNER_TEMP}/l9-exact-worker-env/bin/l9-topology-worker \
            --dispatch-file /tmp/l9-stage-dispatch.json \
            --repo-root . \
            --workspace "${RUNNER_TEMP}/l9-topology-worker"

      - name: Upload worker evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: l9-topology-worker-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/l9-topology-worker/
          if-no-files-found: warn
          retention-days: 14

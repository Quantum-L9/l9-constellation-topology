name: l9-pr-validate

# validate runs for every pull request, whatever its base, so a stacked PR
# gets the repository-native ladder too. direct-compile-smoke publishes to
# GHCR, so it stays limited to pull requests into main (see its if: below).
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l9-pr-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check --only-binary ":all:" uv==0.10.0

      # --no-build keeps third-party source distributions out of the validation
      # environment. It also refuses this project's own editable install, which
      # has no wheel, so the project is excluded here and installed from its own
      # tree below. --no-deps keeps that second step from resolving anything new.
      - name: Synchronize frozen validation environment
        run: uv sync --frozen --no-build --extra dev --no-install-project

      - name: Install the project under validation from its own tree
        run: uv pip install --no-deps --editable .

      # Each run step below passes --no-sync: the environment above is already the
      # locked one, and an implicit re-sync would resolve and build again.

      - name: Compile sources
        run: uv run --no-sync python -m compileall src tests scripts -q

      - name: Run tests with coverage gate
        run: >-
          uv run --no-sync pytest
          --cov=l9_constellation_topology
          --cov-report=term-missing
          --cov-report=xml
          -q

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Lint source and tests
        run: uv run --no-sync ruff check .

      - name: Enforce strict typing
        run: uv run --no-sync mypy src/l9_constellation_topology

      - name: Validate contracts
        run: uv run --no-sync python scripts/validate_contracts.py

      - name: Validate GitHub workflow contracts
        run: uv run --no-sync python scripts/validate_workflows.py

      - name: Enforce architecture boundaries
        run: uv run --no-sync python scripts/architecture_boundary_check.py

      - name: Validate release readiness and no-stub policy
        run: uv run --no-sync python scripts/validate_release_readiness.py

      - name: Bind validation to committed Git tree
        run: >-
          uv run --no-sync python scripts/validate_git_integrity.py
          --out validation/commit-bound-validation.json

      - name: Verify deterministic semantic identity
        run: uv run --no-sync python scripts/verify_determinism.py

      - name: Build distribution
        run: uv build

      # Runtime dependencies come from the lock, not from a fresh resolution of
      # the wheel metadata. uv pip check then proves the wheel's declared
      # requirements are all satisfied, so a dependency missing from the wheel
      # metadata still fails here.
      - name: Smoke-install wheel
        run: |
          UV_PROJECT_ENVIRONMENT=.wheel-smoke uv sync --frozen --no-build --no-dev --no-install-project
          uv pip install --no-deps --no-build --python .wheel-smoke/bin/python dist/*.whl
          uv pip check --python .wheel-smoke/bin/python
          .wheel-smoke/bin/l9-topology --help
          .wheel-smoke/bin/l9-topology-worker --help

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: l9-constellation-topology-validation-${{ github.sha }}
          path: |
            dist/
            coverage.xml
            contracts/
            schemas/
            validation/commit-bound-validation.json
            validation/validation_report.yaml
            validation/validation_checks.jsonl
          if-no-files-found: error
          retention-days: 14

  direct-compile-smoke:
    # Publishes to GHCR, so it runs for merge-queue, dispatch and main-bound PR
    # events only. A stacked PR is still validated by the validate job above.
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    # Ceiling for the called workflow. compile.yml splits these further: its
    # compile job takes contents: read only, and packages: write reaches only
    # its publish job.
    permissions:
      contents: read
      packages: write
      actions: read
    uses: ./.github/workflows/compile.yml
    with:
      source_repository: Quantum-L9/l9-constellation-topology
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      source_name: l9-constellation-topology
      # The PR proof binds the exact commit the maintained v4 line resolves to:
      # l9-meta-injector v4.3.0 (release.yml moved v4 to it on 2026-11-03). The
      # released reusable interface defaults to the mutable v4 tag; this proof
      # pins its current target so a later move of v4 is a deliberate re-pin here.
      meta_ref: c53ef3aa0ccea04af2adfe67800ad09843b6e0fe
      publish: true

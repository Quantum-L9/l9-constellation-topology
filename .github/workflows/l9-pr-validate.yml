name: l9-pr-validate

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l9-pr-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip

      # uv >= 0.12.6 exempts first-party workspace packages from --no-build, so
      # the frozen, no-build sync below can still install this project itself.
      # Earlier releases refused: "marked as --no-build but has no binary
      # distribution". Keep the pin at or above 0.12.6.
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check --only-binary ":all:" uv==0.12.10

      - name: Synchronize frozen validation environment
        run: uv sync --frozen --no-build --extra dev

      - name: Compile sources
        run: uv run --frozen --no-build python -m compileall src tests scripts -q

      - name: Run tests with coverage gate
        run: >-
          uv run --frozen --no-build pytest
          --cov=l9_constellation_topology
          --cov-report=term-missing
          --cov-report=xml
          -q

      - name: Check formatting
        run: uv run --frozen --no-build ruff format --check .

      - name: Lint source and tests
        run: uv run --frozen --no-build ruff check .

      - name: Enforce strict typing
        run: uv run --frozen --no-build mypy src/l9_constellation_topology

      - name: Validate contracts
        run: uv run --frozen --no-build python scripts/validate_contracts.py

      - name: Validate GitHub workflow contracts
        run: uv run --frozen --no-build python scripts/validate_workflows.py

      - name: Enforce architecture boundaries
        run: uv run --frozen --no-build python scripts/architecture_boundary_check.py

      - name: Validate release readiness and no-stub policy
        run: uv run --frozen --no-build python scripts/validate_release_readiness.py

      - name: Bind validation to committed Git tree
        run: >-
          uv run --frozen --no-build python scripts/validate_git_integrity.py
          --out validation/commit-bound-validation.json

      - name: Verify deterministic semantic identity
        run: uv run --frozen --no-build python scripts/verify_determinism.py

      - name: Build distribution
        run: uv build

      # The wheel's runtime dependencies are constrained to the exact versions
      # in uv.lock, so the smoke install resolves nothing outside the lockfile.
      - name: Smoke-install wheel
        run: |
          uv venv .wheel-smoke
          uv export --frozen --no-dev --no-emit-project --no-hashes --output-file .wheel-smoke/constraints.txt
          uv pip install --no-build --python .wheel-smoke/bin/python --constraint .wheel-smoke/constraints.txt dist/*.whl
          .wheel-smoke/bin/l9-topology --help
          .wheel-smoke/bin/l9-topology-worker --help

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: l9-constellation-topology-validation-${{ github.sha }}
          path: |
            dist/
            coverage.xml
            contracts/
            schemas/
            validation/commit-bound-validation.json
            validation/validation_report.yaml
            validation/validation_checks.jsonl
          if-no-files-found: error
          retention-days: 14

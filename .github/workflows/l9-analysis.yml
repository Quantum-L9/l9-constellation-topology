# L9 Governed Analysis Pipeline — Python Preset (LOCKED)
#
# DO NOT EDIT — this file is managed by l9-ci-core presets/python.
# To update, pull the latest preset from Quantum-L9/l9-ci-core.
#
# LOCAL DEVIATION (audit F-06): the governed profile is selected per triggering event
# instead of hardcoding `pr_fast`, because `pr_fast` forbids `push` (see
# .github/governance/execution-profiles.yaml) and this workflow triggers on push to main.
# The canonical fix belongs upstream in Quantum-L9/l9-ci-core presets/python; this local
# change keeps post-merge governed analysis reachable until the preset is updated.
# NOTE: the current preset already implements this profile-selection logic upstream;
# the local deviation is now redundant and this file can be replaced by the plain preset.
#
# Thin caller into Core analyze-semgrep.yml (SDK semgrep run → gate →
# publish + SARIF). Language is locked to python.

name: L9 Analysis
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
env:
  # Pin to a full Core SHA. Keep L9_CORE_REF here for humans/agents.
  # BUMP after Quantum-L9/l9-ci-core#135 merges to pick up token-URL fix.
  L9_CORE_REF: "d6e778c907e3711c4f610fe135ea8cc7a6c5350d"
permissions:
  contents: read
concurrency:
  group: l9-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (semgrep)
    uses: Quantum-L9/l9-ci-core/.github/workflows/analyze-semgrep.yml@d6e778c907e3711c4f610fe135ea8cc7a6c5350d
    permissions:
      actions: read
      checks: write
      contents: read
      security-events: write
    with:
      profile: >-
        ${{ github.event_name == 'push' && 'merge'
         || github.event_name == 'workflow_dispatch' && 'nightly'
         || 'pr_fast' }}
      matrix-id: pr-semgrep
      language: python

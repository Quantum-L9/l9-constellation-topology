# SonarQube Cloud automatic analysis scope (read from the default branch).
# Automatic analysis allows no wildcard patterns, so the scope is a list of
# directories rather than an exclusion glob.
#
# evidence/ is left out on purpose: it is a byte-exact record of the
# 2026-08-02 live qualification run (Dockerfile, Odoo e2e config, harness),
# not code this repository builds or executes (issue #37).
# tests/ is analysed as test code; tests/fixtures/ holds sample input
# repositories that the topology compiler reads as data.
sonar.sources=.github,config,contracts,docs,outputs,reports,schemas,scripts,src,validation
sonar.tests=tests
sonar.python.version=3.12

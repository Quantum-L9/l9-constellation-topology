schema: l9.traceability-map/v1
artifact: l9-constellation-topology
release: 2.0.0-pr1-review-fix
changes:
  - id: TRACE-001
    source: src/l9_constellation_topology/scanners/dependency_scanner.py
    defect: malformed package.json was silently ignored
    fix: reject invalid JSON, non-object roots, and non-object dependency sections
    validation:
      - tests/test_release_readiness.py::test_dependency_scanner_rejects_malformed_package_json
      - tests/test_release_readiness.py::test_dependency_scanner_rejects_non_object_dependency_section
  - id: TRACE-002
    source: src/l9_constellation_topology/io/output_sink.py
    defect: protocol methods used ellipsis-only bodies
    fix: explicit fail-closed structural-contract bodies
    validation:
      - scripts/validate_release_readiness.py
      - tests/test_release_readiness.py::test_release_readiness_has_no_blocking_findings
  - id: TRACE-003
    source: src/l9_constellation_topology/sources/reader.py
    defect: protocol methods used ellipsis-only bodies
    fix: explicit fail-closed structural-contract bodies
    validation:
      - scripts/validate_release_readiness.py
  - id: TRACE-004
    source: src/l9_constellation_topology/packets/loader.py
    defect: exception class used a pass-only body
    fix: explicit exception responsibility docstring
    validation:
      - scripts/validate_release_readiness.py
  - id: TRACE-005
    source: .github/workflows/l9-pr-validate.yml
    defect: pull-request validation omitted release-readiness enforcement
    fix: execute the hardening gate in CI
    validation:
      - scripts/validate_workflows.py
  - id: TRACE-006
    source: repository root
    defect: required handoff and evidence artifacts were absent
    fix: add manifest, final tree, validation, Unknown, regression, audit, fix, and convergence artifacts
    validation:
      - scripts/validate_release_readiness.py
  - id: ENRICH-001
    source: user_request.initial_commit_enrichment
    gap: missing_complete_root_governance_and_decision_memory
    fixes:
      - ARCHITECTURE.md
      - BUILD_SPECIFICATION.md
      - GOVERNANCE.md
      - MAINTAINERS.md
      - CODE_OF_CONDUCT.md
      - SUPPORT.md
      - ROADMAP.md
      - RELEASING.md
      - DEVELOPMENT.md
      - THREAT_MODEL.md
      - DEPENDENCY_POLICY.md
      - LICENSE
      - NOTICE.md
      - INITIAL_COMMIT.md
      - ADR_INDEX.md
      - docs/adr/
    validation:
      - tests/test_repository_governance.py
      - scripts/validate_release_readiness.py
    status: implemented
  - id: ENRICH-002
    source: docs/archive/v4/
    gap: archived documentation contained broken repository-local links
    fixes:
      - docs/archive/v4/README.md
      - docs/archive/v4/architecture.md
    validation:
      - repository-wide internal Markdown link check
    status: implemented
  - id: REM-001
    source: Git index, MANIFEST.md, .github/, .l9/
    defect: validated package and committed repository tree diverged
    fix: restore hidden repository surfaces, validate human inventory paths, and bind committed content through a Git-native mode, object-type, and blob-ID manifest
    validation:
      - scripts/validate_git_integrity.py
      - .github/workflows/l9-pr-validate.yml
    status: implemented
  - id: REM-002
    source: src/l9_constellation_topology/compiler.py
    defect: idempotency omitted risk, maturity, packet, report, and output policy changes
    fix: hash a complete semantic compilation fingerprint
    validation:
      - tests/test_confirmed_findings_remediation.py::test_idempotency_fingerprint_changes_for_every_semantic_policy
      - tests/test_confirmed_findings_remediation.py::test_idempotency_fingerprint_changes_for_schema_and_build_identity
    status: implemented
  - id: REM-003
    source: src/l9_constellation_topology/worker/callback.py
    defect: dispatch could select an arbitrary callback URL and worker environment secret
    fix: callback ID resolved through worker-local destination and credential policy with redirect and network controls
    validation:
      - tests/test_worker_v5.py::test_callback_contract_rejects_packet_selected_url_and_secret
      - tests/test_worker_v5.py::test_callback_id_must_exist_in_local_policy
    status: implemented
  - id: REM-004
    source: src/l9_constellation_topology/worker/packet_store.py
    defect: publication verification accepted any internally valid bundle at the supplied URI
    fix: require digest-qualified OCI references and compare retrieved content with the exact expected PacketRef and manifest digests
    validation:
      - tests/test_packet_store_v5.py::test_verify_published_binds_uri_to_expected_packet
      - tests/test_packet_store_v5.py::test_oci_verification_rejects_mutable_tag_before_pull
    status: implemented
  - id: REM-005
    source: repository model adapter, TopologyState, packet schemas, topology validator
    defect: accepted upstream diagnostics disappeared during compilation
    fix: preserve typed diagnostics with source lineage and enforce a conservation invariant
    validation:
      - tests/test_confirmed_findings_remediation.py::test_input_diagnostics_are_preserved_and_round_trip
    status: implemented
  - id: REM-006
    source: PacketBundleOutputSink and LocalPacketRegistry
    defect: multi-file bundle visibility and local recovery writes were not transaction-safe
    fix: atomic staged-directory publication and SQLite WAL local registry transactions
    validation:
      - tests/test_confirmed_findings_remediation.py::test_packet_bundle_commit_is_atomic_on_staging_failure
      - tests/test_confirmed_findings_remediation.py::test_local_registry_is_transaction_safe_under_concurrent_writers
    status: implemented
  - id: REM-007
    source: src/l9_constellation_topology/validation/topology_validator.py
    defect: validation receipts conflated model construction with independent schema verification
    fix: report separate model-construction, JSON Schema, invariant, evidence, and cross-packet layers
    validation:
      - tests/test_confirmed_findings_remediation.py::test_independent_json_schema_validation_can_block_compilation
    status: implemented

  - id: REVIEW-001
    source: src/l9_constellation_topology/worker/callback.py
    defect: callback path policy used a raw string prefix and permitted sibling paths such as /api/results-evil
    fix: require exact or slash-delimited descendant paths and reject encoded slash or backslash ambiguity before request construction
    validation:
      - tests/test_worker_v5.py::test_callback_path_policy_uses_segment_boundaries
      - tests/test_worker_v5.py::test_callback_endpoint_rejects_encoded_separator_before_request
    status: implemented
  - id: REVIEW-002
    source: MANIFEST.md, GIT_TREE_MANIFEST.json, scripts/git_tree_manifest.py, scripts/validate_git_integrity.py
    defect: commit-bound validation proved tracked-path equality but did not prove per-file committed content identity
    fix: retain MANIFEST.md as the human inventory and add a non-self-referential Git-native manifest covering path, mode, object type, and blob ID
    validation:
      - tests/test_git_integrity.py::test_git_integrity_binds_paths_modes_and_blob_ids
      - tests/test_git_integrity.py::test_git_integrity_rejects_same_paths_with_changed_blob
      - scripts/validate_git_integrity.py
    status: implemented
  - id: REVIEW-003
    source: .l9/callback-policy.yaml and src/l9_constellation_topology/worker/callback.py
    gap: local callback policy selected a destination indirectly but did not explicitly constrain its hostname and port
    fix: add expected host and port constraints and disable the production callback profile until an approved host is committed
    validation:
      - tests/test_worker_v5.py::test_callback_endpoint_enforces_expected_host_and_port
      - tests/test_worker_v5.py::test_disabled_production_callback_fails_closed
    status: implemented
  - id: REVIEW-004
    source: src/l9_constellation_topology/worker/packet_store.py
    gap: OCI publication could initially target a shared mutable tag and trusted only the digest reported by push
    fix: publish through a semantic-hash-derived staging tag and independently fetch the registry descriptor before packet acceptance
    validation:
      - tests/test_packet_store_v5.py::test_oci_publish_returns_digest_qualified_uri
      - tests/test_packet_store_v5.py::test_oci_verification_resolves_registry_descriptor_independently
    status: implemented
  - id: REVIEW-005
    source: scripts/generate_schemas.py, scripts/generate_fixture_packets.py, Makefile
    gap: generated schemas and packet fixtures could drift because validation checked current files but never recomputed expected bytes
    fix: add scripts/generated_artifact_sync.py with read-only drift detection and explicit update targets; gate make validate on the deterministic schemas-check
    validation:
      - tests/test_generated_artifact_sync.py
      - make schemas-check
      - make validate
    status: implemented; fixture and hash-locality drift gates now enforced after fixture generation was made deterministic (pinned created_at, content-derived source_revision)
  - id: ACT-001
    source: src/l9_constellation_topology/publication/, .l9/publication-policy.yaml, docs/adr/0021-internalize-publication-planning-and-memory-lowering.md
    gap: ADR-0020 delegated publication planning to l9-topology-ingestion-bridge, a repository that was never built, so validated topology truth had no downstream path
    fix: internalize publication eligibility, destination-neutral memory lowering, and deterministic effect planning as an internal boundary; supersede ADR-0020 on repository placement only and preserve every prohibition it recorded
    validation:
      - tests/test_publication_planning.py
      - tests/test_publication_downstream_conformance.py
      - scripts/architecture_boundary_check.py
    status: implemented
  - id: ACT-002
    source: src/l9_constellation_topology/publication/contracts.py, tests/fixtures/downstream_contracts/l9-graphiti-memory-contract.json
    gap: lowered memory intents were never checked against the real l9-graphiti-memory contract, so producer and consumer could drift silently
    fix: mirror MemoryWriteRequest field-for-field, capture a contract descriptor from the bound downstream revision for offline drift detection, and validate eligible intents against the real GateMemoryBridge.validate_intent when a read-only checkout is supplied
    validation:
      - tests/test_publication_downstream_conformance.py::test_mirror_field_names_match_the_downstream_contract
      - tests/test_publication_downstream_conformance.py::test_intents_validate_against_the_real_downstream_boundary
    status: implemented_offline_gate_enforced; live probe requires L9_GRAPHITI_MEMORY_SRC and is skipped when absent
  - id: ACT-003
    source: scripts/generate_schemas.py, schemas/topology-publication-plan.schema.json
    gap: adding the publication plan contract under contracts/ would change schema_contract_hash and therefore every Topology Packet semantic identity
    fix: place the derived publication plan schema under schemas/ so publication policy and contracts never alter canonical topology identity
    validation:
      - tests/test_publication_planning.py::test_publication_policy_is_excluded_from_topology_configuration
      - tests/test_publication_planning.py::test_plan_is_derived_and_leaves_topology_packet_unchanged
      - make schemas-check
    status: implemented
  - id: ACT-004
    source: src/l9_constellation_topology/packets/bundle_verification.py, src/l9_constellation_topology/io/packet_bundle_output_sink.py
    gap: F-T0 - the packet bundle sink verified every staged bundle with load_topology_bundle, so the compatibility scan's synthetic l9.repository-model bundle was judged against Topology Packet semantics and always failed
    fix: dispatch post-write verification on the packet type the staged manifest declares, keeping OutputSink the only write boundary, keeping verification enabled, and failing closed on an unrecognized packet type
    validation:
      - tests/test_scan_compatibility_path.py::test_scan_of_a_trivial_repository_succeeds_and_validates
      - tests/test_scan_compatibility_path.py::test_scan_verifies_the_intermediate_bundle_as_a_repository_model
      - tests/test_scan_compatibility_path.py::test_unknown_packet_type_fails_closed
      - tests/test_scan_compatibility_path.py::test_scan_of_a_real_repository_compiles_and_leaves_it_untouched
    status: implemented
  - id: ACT-005
    source: src/l9_constellation_topology/io/failure_report.py, src/l9_constellation_topology/cli.py
    gap: >-
      F-T2 - a failed bundle commit was reported only as its receipt status, producing
      "direct observation bundle commit failed: failed" and discarding the inner
      validation reasons the receipt already carried
    fix: render the receipt deterministically with failure stage, packet type, affected member, and inner message; print a shared atomic-bundle cause once and name each affected member against it
    validation:
      - tests/test_scan_compatibility_path.py::test_commit_failure_reporting_names_stage_member_and_cause
      - tests/test_scan_compatibility_path.py::test_commit_failure_reporting_repeats_a_shared_cause_only_once
      - tests/test_scan_compatibility_path.py::test_tampered_repository_model_member_is_rejected_actionably
    status: implemented
  - id: ACT-006
    source: src/l9_constellation_topology/reconciliation/cardinality.py, src/l9_constellation_topology/stages/reconcile_evidence.py
    gap: any subject field observed with more than one distinct value became a conflict, so set-valued facts such as languages, workflows, and governance references produced false contradictions that held otherwise sound publication candidates
    fix: declare single, set, and unknown cardinality as versioned compiler policy; conflict only on single-valued incompatibility, aggregate set-valued facts deterministically with full evidence retention, emit an explicit unknown for undeclared fields, and hash the policy into TopologyPacket.policy_hashes so a semantics change cannot reuse an older packet identity
    validation:
      - tests/test_conflict_cardinality.py
      - tests/test_conflict_cardinality.py::test_reconciliation_policy_is_versioned_into_topology_identity
      - tests/test_repository_model_readiness.py::test_enriched_declared_actions_aggregate_rather_than_conflict
    status: implemented
  - id: ACT-007
    source: src/l9_constellation_topology/publication/identity.py, src/l9_constellation_topology/publication/lowering.py, HASH_LOCALITY_EVALUATION.json
    gap: the v1 idempotency key bound every downstream effect to the whole Topology Packet semantic hash and the whole publication policy hash, so any unrelated change anywhere in a snapshot re-keyed every otherwise unchanged durable write
    fix: introduce the explicitly versioned v2 fact-local effect identity built from operation, namespace, memory class, content, assertion, stable source fact identity, normalized confidence and evidence semantics, and lowering contract version; exclude snapshot-global identity, whole policy hash, repository-wide revision, timestamps and paths; encode the algorithm version in the key namespace
    validation:
      - tests/test_hash_locality.py
      - tests/test_publication_planning.py::test_unrelated_policy_change_preserves_unaffected_effect_keys
      - tests/test_publication_planning.py::test_effect_key_excludes_snapshot_global_identity
      - make hash-locality
    status: implemented; no durable v1 admission ever occurred because this repository has never contained a dispatch path, so no migration was required
  - id: ACT-008
    source: docs/design/l9-constellation-topology-spec.md, docs/publication-boundary.md, docs/evidence-model.md, docs/output-sink.md
    gap: the design specification still presented l9-topology-ingestion-bridge as a current runtime component, contradicting accepted ADR-0021
    fix: mark every ingestion-bridge claim as superseded historical architecture under ADR-0020, state the current internal publication pipeline, and document effect identity, cardinality, and packet-type-aware verification in the normative docs
    validation:
      - docs/adr/0021-internalize-publication-planning-and-memory-lowering.md
      - tests/test_repository_governance.py
    status: implemented
  - id: ACT-009
    source: src/l9_constellation_topology/packets/corpus_intelligence.py, src/l9_constellation_topology/packets/corpus_validator.py, src/l9_constellation_topology/domain/candidate.py, src/l9_constellation_topology/domain/readiness.py, docs/adr/0026-accept-corpus-intelligence-as-an-auxiliary-packet.md
    gap: topology could compile per-root repository observation only, so the corpus analysis l9-meta-injector now produces — cross-root byte identity, candidate bodies of work, readiness measurement, reasoning routing — had no way in; widening l9.repository-model to carry it would have made source observation and derived candidate analysis indistinguishable at the one boundary where that distinction can still be made
    fix: accept l9.corpus-intelligence 1.0.0 as a separate optional auxiliary packet with fail-closed referential integrity against exactly the repository packets it names; carry the epistemic classes in the type system so candidates live outside edge_records and cannot reach impact, flow, maturity, risk, or publication by being forgotten
    validation:
      - tests/test_corpus_intelligence_contract.py
      - tests/test_corpus_topology_compilation.py
      - tests/test_corpus_publication_containment.py
    status: implemented
  - id: ACT-010
    source: src/l9_constellation_topology/run/evidence.py, src/l9_constellation_topology/packets/document_signal_evidence.py
    gap: EvidenceSourceRef carried only source_path and line_number, so a work signal decoded from a Word document, slide deck, workbook, or PDF could be recorded only by flattening its true coordinate into a line number that names nothing an operator can open
    fix: add a discriminated SourceLocator union over the coordinate systems real formats have, and refuse a line number beside a structured locator in both EvidenceSourceRef and the corpus packet validator; existing repository-model assertions keep line_number alone and serialize byte-identically, so no published effect key moves
    validation:
      - tests/test_structured_locators.py
      - tests/test_corpus_topology_compilation.py::test_no_evidence_in_the_compile_carries_a_fake_line_number
    status: implemented
  - id: ACT-011
    source: src/l9_constellation_topology/stages/reconcile_assertions.py, src/l9_constellation_topology/reconciliation/inputs.py, src/l9_constellation_topology/stages/reconcile_evidence.py
    gap: a second reconciliation path for structured documents would have filed a .docx declaring Complete and a .md declaring WIP as two internally consistent facts in two collections, so the contradiction would have been reported by neither
    fix: lower both producers to SemanticInput and reconcile through one engine under one predicate registry; exclude document-signal evidence from field-cardinality judgement for the same reason assertion evidence already was, since its field is a predicate rather than a record field
    validation:
      - tests/test_corpus_topology_compilation.py::test_a_docx_and_a_pptx_disagreeing_is_one_conflict_not_two_facts
      - tests/test_assertion_reconciliation.py
    status: implemented
  - id: ACT-012
    source: src/l9_constellation_topology/domain/edge.py, src/l9_constellation_topology/topology/impact.py
    gap: assess_impact defaulted its admissible edge types to set(EdgeType), so adding DUPLICATE_OF would have pulled byte identity into dependency traversal — making every copy of a shared licence file a dependency hop and connecting otherwise unrelated repositories through it
    fix: version the edge taxonomy to 2.0.0, declare NON_TRAVERSABLE_EDGE_TYPES, default impact to the traversable set while still honouring an explicit request, and bind the taxonomy hash into TopologyPacket.policy_hashes
    validation:
      - tests/test_corpus_topology_compilation.py::test_duplicate_edges_do_not_contribute_to_dependency_impact
      - tests/test_corpus_topology_compilation.py::test_duplicate_edges_are_reachable_when_explicitly_requested
      - tests/test_corpus_hash_locality.py::test_the_edge_taxonomy_is_bound_into_topology_identity
    status: implemented
  - id: ACT-013
    source: src/l9_constellation_topology/packets/loader.py
    gap: load_topology_bundle wrote semantic_claims into every topology bundle and never read them back, so a bundle round-trip silently dropped every reconciled claim
    fix: read the semantic_claims payload domain alongside the others
    validation:
      - tests/test_corpus_topology_compilation.py
      - tests/test_topology_compiler_v5.py::test_golden_topology_bundle_matches_fixed_compiler_output
    status: implemented


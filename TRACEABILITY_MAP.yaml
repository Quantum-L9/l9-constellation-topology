    fix: reject invalid JSON, non-object roots, and non-object dependency sections
    validation:
      - tests/test_release_readiness.py::test_dependency_scanner_rejects_malformed_package_json
      - tests/test_release_readiness.py::test_dependency_scanner_rejects_non_object_dependency_section
  - id: TRACE-002
    source: src/l9_constellation_topology/io/output_sink.py
    defect: protocol methods used ellipsis-only bodies
    fix: explicit fail-closed structural-contract bodies
    validation:
      - scripts/validate_release_readiness.py
      - tests/test_release_readiness.py::test_release_readiness_has_no_blocking_findings
  - id: TRACE-003
    source: src/l9_constellation_topology/sources/reader.py
    defect: protocol methods used ellipsis-only bodies
    fix: explicit fail-closed structural-contract bodies
    validation:
      - scripts/validate_release_readiness.py
  - id: TRACE-004
    source: src/l9_constellation_topology/packets/loader.py

schema: l9.traceability-map/v1
artifact: l9-constellation-topology
release: 2.0.0-pr1-review-fix
changes:
  - id: TRACE-001
    source: src/l9_constellation_topology/scanners/dependency_scanner.py
    defect: malformed package.json was silently ignored
    fix: reject invalid JSON, non-object roots, and non-object dependency sections
    validation:
      - tests/test_release_readiness.py::test_dependency_scanner_rejects_malformed_package_json
      - tests/test_release_readiness.py::test_dependency_scanner_rejects_non_object_dependency_section
  - id: TRACE-002
    source: src/l9_constellation_topology/io/output_sink.py
    defect: protocol methods used ellipsis-only bodies
    fix: explicit fail-closed structural-contract bodies
    validation:
      - scripts/validate_release_readiness.py
      - tests/test_release_readiness.py::test_release_readiness_has_no_blocking_findings
  - id: TRACE-003
    source: src/l9_constellation_topology/sources/reader.py
    defect: protocol methods used ellipsis-only bodies
    fix: explicit fail-closed structural-contract bodies
    validation:
      - scripts/validate_release_readiness.py
  - id: TRACE-004
    source: src/l9_constellation_topology/packets/loader.py
    defect: exception class used a pass-only body
    fix: explicit exception responsibility docstring
    validation:
      - scripts/validate_release_readiness.py
  - id: TRACE-005
    source: .github/workflows/l9-pr-validate.yml
    defect: pull-request validation omitted release-readiness enforcement
    fix: execute the hardening gate in CI
    validation:
      - scripts/validate_workflows.py
  - id: TRACE-006
    source: repository root
    defect: required handoff and evidence artifacts were absent
    fix: add manifest, final tree, validation, Unknown, regression, audit, fix, and convergence artifacts
    validation:
      - scripts/validate_release_readiness.py
  - id: ENRICH-001
    source: user_request.initial_commit_enrichment
    gap: missing_complete_root_governance_and_decision_memory
    fixes:
      - ARCHITECTURE.md
      - BUILD_SPECIFICATION.md
      - GOVERNANCE.md
      - MAINTAINERS.md
      - CODE_OF_CONDUCT.md
      - SUPPORT.md
      - ROADMAP.md
      - RELEASING.md
      - DEVELOPMENT.md
      - THREAT_MODEL.md
      - DEPENDENCY_POLICY.md
      - LICENSE
      - NOTICE.md
      - INITIAL_COMMIT.md
      - ADR_INDEX.md
      - docs/adr/
    validation:
      - tests/test_repository_governance.py
      - scripts/validate_release_readiness.py
    status: implemented
  - id: ENRICH-002
    source: docs/archive/v4/
    gap: archived documentation contained broken repository-local links
    fixes:
      - docs/archive/v4/README.md
      - docs/archive/v4/architecture.md
    validation:
      - repository-wide internal Markdown link check
    status: implemented
  - id: REM-001
    source: Git index, MANIFEST.md, .github/, .l9/
    defect: validated package and committed repository tree diverged
    fix: restore hidden repository surfaces, validate human inventory paths, and bind committed content through a Git-native mode, object-type, and blob-ID manifest
    validation:
      - scripts/validate_git_integrity.py
      - .github/workflows/l9-pr-validate.yml
    status: implemented
  - id: REM-002
    source: src/l9_constellation_topology/compiler.py
    defect: idempotency omitted risk, maturity, packet, report, and output policy changes
    fix: hash a complete semantic compilation fingerprint
    validation:
      - tests/test_confirmed_findings_remediation.py::test_idempotency_fingerprint_changes_for_every_semantic_policy
      - tests/test_confirmed_findings_remediation.py::test_idempotency_fingerprint_changes_for_schema_and_build_identity
    status: implemented
  - id: REM-003
    source: src/l9_constellation_topology/worker/callback.py
    defect: dispatch could select an arbitrary callback URL and worker environment secret
    fix: callback ID resolved through worker-local destination and credential policy with redirect and network controls
    validation:
      - tests/test_worker_v5.py::test_callback_contract_rejects_packet_selected_url_and_secret
      - tests/test_worker_v5.py::test_callback_id_must_exist_in_local_policy
    status: implemented
  - id: REM-004
    source: src/l9_constellation_topology/worker/packet_store.py
    defect: publication verification accepted any internally valid bundle at the supplied URI
    fix: require digest-qualified OCI references and compare retrieved content with the exact expected PacketRef and manifest digests
    validation:
      - tests/test_packet_store_v5.py::test_verify_published_binds_uri_to_expected_packet
      - tests/test_packet_store_v5.py::test_oci_verification_rejects_mutable_tag_before_pull
    status: implemented
  - id: REM-005
    source: repository model adapter, TopologyState, packet schemas, topology validator
    defect: accepted upstream diagnostics disappeared during compilation
    fix: preserve typed diagnostics with source lineage and enforce a conservation invariant
    validation:
      - tests/test_confirmed_findings_remediation.py::test_input_diagnostics_are_preserved_and_round_trip
    status: implemented
  - id: REM-006
    source: PacketBundleOutputSink and LocalPacketRegistry
    defect: multi-file bundle visibility and local recovery writes were not transaction-safe
    fix: atomic staged-directory publication and SQLite WAL local registry transactions
    validation:
      - tests/test_confirmed_findings_remediation.py::test_packet_bundle_commit_is_atomic_on_staging_failure
      - tests/test_confirmed_findings_remediation.py::test_local_registry_is_transaction_safe_under_concurrent_writers
    status: implemented
  - id: REM-007
    source: src/l9_constellation_topology/validation/topology_validator.py
    defect: validation receipts conflated model construction with independent schema verification
    fix: report separate model-construction, JSON Schema, invariant, evidence, and cross-packet layers
    validation:
      - tests/test_confirmed_findings_remediation.py::test_independent_json_schema_validation_can_block_compilation
    status: implemented

  - id: REVIEW-001
    source: src/l9_constellation_topology/worker/callback.py
    defect: callback path policy used a raw string prefix and permitted sibling paths such as /api/results-evil
    fix: require exact or slash-delimited descendant paths and reject encoded slash or backslash ambiguity before request construction
    validation:
      - tests/test_worker_v5.py::test_callback_path_policy_uses_segment_boundaries
      - tests/test_worker_v5.py::test_callback_endpoint_rejects_encoded_separator_before_request
    status: implemented
  - id: REVIEW-002
    source: MANIFEST.md, GIT_TREE_MANIFEST.json, scripts/git_tree_manifest.py, scripts/validate_git_integrity.py
    defect: commit-bound validation proved tracked-path equality but did not prove per-file committed content identity
    fix: retain MANIFEST.md as the human inventory and add a non-self-referential Git-native manifest covering path, mode, object type, and blob ID
    validation:
      - tests/test_git_integrity.py::test_git_integrity_binds_paths_modes_and_blob_ids
      - tests/test_git_integrity.py::test_git_integrity_rejects_same_paths_with_changed_blob
      - scripts/validate_git_integrity.py
    status: implemented
  - id: REVIEW-003
    source: .l9/callback-policy.yaml and src/l9_constellation_topology/worker/callback.py
    gap: local callback policy selected a destination indirectly but did not explicitly constrain its hostname and port
    fix: add expected host and port constraints and disable the production callback profile until an approved host is committed
    validation:
      - tests/test_worker_v5.py::test_callback_endpoint_enforces_expected_host_and_port
      - tests/test_worker_v5.py::test_disabled_production_callback_fails_closed
    status: implemented
  - id: REVIEW-004
    source: src/l9_constellation_topology/worker/packet_store.py
    gap: OCI publication could initially target a shared mutable tag and trusted only the digest reported by push
    fix: publish through a semantic-hash-derived staging tag and independently fetch the registry descriptor before packet acceptance
    validation:
      - tests/test_packet_store_v5.py::test_oci_publish_returns_digest_qualified_uri
      - tests/test_packet_store_v5.py::test_oci_verification_resolves_registry_descriptor_independently
    status: implemented
  - id: REVIEW-005
    source: scripts/generate_schemas.py, scripts/generate_fixture_packets.py, Makefile
    gap: generated schemas and packet fixtures could drift because validation checked current files but never recomputed expected bytes
    fix: add scripts/generated_artifact_sync.py with read-only drift detection and explicit update targets; gate make validate on the deterministic schemas-check
    validation:
      - tests/test_generated_artifact_sync.py
      - make schemas-check
      - make validate
    status: implemented_schema_gate_enforced; fixture drift gate deferred pending deterministic fixture generation (non-deterministic created_at and repository-revision-bound source_revision)
  - id: ACT-001
    source: src/l9_constellation_topology/publication/, .l9/publication-policy.yaml, docs/adr/0021-internalize-publication-planning-and-memory-lowering.md
    gap: ADR-0020 delegated publication planning to l9-topology-ingestion-bridge, a repository that was never built, so validated topology truth had no downstream path
    fix: internalize publication eligibility, destination-neutral memory lowering, and deterministic effect planning as an internal boundary; supersede ADR-0020 on repository placement only and preserve every prohibition it recorded
    validation:
      - tests/test_publication_planning.py
      - tests/test_publication_downstream_conformance.py
      - scripts/architecture_boundary_check.py
    status: implemented
  - id: ACT-002
    source: src/l9_constellation_topology/publication/contracts.py, tests/fixtures/downstream_contracts/l9-graphiti-memory-contract.json
    gap: lowered memory intents were never checked against the real l9-graphiti-memory contract, so producer and consumer could drift silently
    fix: mirror MemoryWriteRequest field-for-field, capture a contract descriptor from the bound downstream revision for offline drift detection, and validate eligible intents against the real GateMemoryBridge.validate_intent when a read-only checkout is supplied
    validation:
      - tests/test_publication_downstream_conformance.py::test_mirror_field_names_match_the_downstream_contract
      - tests/test_publication_downstream_conformance.py::test_intents_validate_against_the_real_downstream_boundary
    status: implemented_offline_gate_enforced; live probe requires L9_GRAPHITI_MEMORY_SRC and is skipped when absent
  - id: ACT-003
    source: scripts/generate_schemas.py, schemas/topology-publication-plan.schema.json
    gap: adding the publication plan contract under contracts/ would change schema_contract_hash and therefore every Topology Packet semantic identity
    fix: place the derived publication plan schema under schemas/ so publication policy and contracts never alter canonical topology identity
    validation:
      - tests/test_publication_planning.py::test_publication_policy_is_excluded_from_topology_configuration
      - tests/test_publication_planning.py::test_plan_is_derived_and_leaves_topology_packet_unchanged
      - make schemas-check
    status: implemented

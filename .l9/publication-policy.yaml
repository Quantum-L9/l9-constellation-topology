id: foundational-topology-publication
# 2.0.0 (ADR-0036): evidence-qualified relation publication and predicate-selective
# claim publication. Under ADR-0025 a version bump re-keys every memory effect,
# because Confidence.policy_version is part of the durable write requested.
version: 2.0.0

# Namespace root for every lowered memory intent. Deterministic and independent
# of the checkout location: a namespace is never derived from a filesystem path.
namespace_root: l9.constellation

# Topology entity kinds eligible for lowering into durable-memory observations.
# Artifact entities are deliberately excluded: file-level inventory is already
# carried by the Topology Packet payload and would publish per-file noise.
eligible_entity_kinds: [repository, capability, semantic_claim]

# Edge taxonomy members eligible for lowering into structured memory assertions.
# CONTAINS is excluded because repository-to-artifact containment restates the
# artifact inventory rather than a constellation-level relational fact.
eligible_edge_types:
  - DEPENDS_ON
  - IMPLEMENTS
  - EXPOSES
  - VALIDATED_BY
  - GOVERNED_BY
  - OWNED_BY
  - DOCUMENTED_BY
  - PRODUCES
  - CONSUMES
  - DERIVED_FROM
  - SUPERSEDES
  - ROUTES_TO
  - PUBLISHES_TO
  - MEMBER_OF
  # Exact byte identity. Decidable, and re-checkable downstream from the hash the
  # edge carries, so it is a canonical fact rather than an analysis result.
  - DUPLICATE_OF
  # Explicitly declared work relations. Eligible only when their target resolved
  # to exactly one observed artifact; publication skips the rest with
  # `relation.work_target_not_exactly_resolved` rather than publishing an
  # assertion whose endpoint this compile never observed.
  - BLOCKED_BY
  - REFERENCES

# Downstream memory classes. Both values are existing l9-graphiti-memory
# MemoryClass members; this repository never invents a downstream enum.
entity_memory_class: observation
relationship_memory_class: semantic
# A reconciled repository-model assertion is a semantic claim about a subject,
# so it lands in the same class as a compiled relationship rather than as a raw
# observation: it is a subject/predicate/object statement, not an inventory line.
claim_memory_class: semantic

# Deterministic topology-confidence to memory-confidence mapping. Scores are
# ceilings, never upgrades: a lowered fact can lose confidence but never gain it.
confidence_score_by_level:
  low: 0.3
  medium: 0.6
  high: 0.9

# Applied when the source assessment records a conflict on the subject.
confidence_conflict_ceiling:
  none: 1.0
  possible: 0.5
  confirmed: 0.3

# Topology derivation method to downstream ConfidenceMethod. `unknown` maps to
# the most conservative supported method rather than to an optimistic one.
confidence_method_by_derivation:
  declared: extracted
  deterministic: aggregated
  cross-record: aggregated
  heuristic: inferred
  model-assisted: inferred
  unknown: inferred

# Topology evidence authority to downstream Provenance.source_trust.
source_trust_by_authority:
  source: 1.0
  validated-machine: 0.9
  derived: 0.7
  candidate: 0.5
  unknown: 0.3

# Topology evidence class to downstream EvidenceKind.
evidence_kind_by_class:
  observed: observation
  declared: explicit
  derived: inference
  assisted: inference
  projected: inference
  validated: test
  committed: explicit

# Fail-closed switches. Disabling any of these is an architecture decision.
require_validated_topology: true
require_resolved_lineage: true
hold_on_material_conflict: true
hold_on_material_unknown: true
hold_on_missing_required_evidence: true
# A claim whose predicate has no declared rule in the predicate registry is held
# rather than published: it is preserved, evidenced, and diagnosed, but what it
# means is not something publication may decide on its own.
hold_on_unsupported_predicate: true

# Relation qualification (ADR-0036). `strict` publishes a selected edge only when
# its own producer evidence proves the relation it states (`qualify_relation`):
# an edge supported only by an artifact's existence or type classification, an
# edge whose producer cannot be identified, and an edge missing its mandatory
# relation-specific evidence are skipped under `qualification.*` reasons. `legacy`
# is the pre-ADR-0036 behaviour.
relation_qualification: strict

# Claim publication (ADR-0036). `selective` lowers only the predicates named
# below. A predicate the registry does not declare is still lowered and held
# (`predicate.unsupported_by_registry`), so a registry gap stays visible.
claim_publication: selective

# Registry predicates with declared semantic meaning: every `set` or `single`
# predicate that is not declaration-only. Auxiliary predicates (existence of a
# claim elsewhere, unresolved references) are not selected.
eligible_claim_predicates:
  - authority.canonical_contract
  - authority.canonical_contract_count
  - contract.invariant
  - document.heading
  - document.title
  - http.handler_body_marker
  - http.route
  - http.route_handler
  - package.build_backend
  - package.dependency
  - package.framework
  - package.name
  - package.packaging_system
  - package.python_constraint
  - package.server
  - package.version
  - repository.disclaimed_role
  - repository.replaced_by
  - repository.self_described_role
  - repository.status
  - service.action
  - service.name
  - service.version
  - work.blocked_by
  - work.depends_on
  - work.kind
  - work.milestone
  - work.references
  - work.status
  - work.superseded_by
  - work.supersedes
  - work.task.completed
  - work.task.open

# Declaration-only predicates (governed `L9_META` header fields, the managed
# l9-meta-injector header, header structure and field observations) explicitly
# opted in to durable semantic memory. None is: header metadata is a declaration a
# file makes about itself (ADR-0033, ADR-0034) and is not lowered by default.
declaration_only_claim_predicates: []

# Upper bound on lowered evidence references per candidate. Truncation is
# recorded on the lowering receipt and in plan diagnostics; it is never silent.
maximum_evidence_refs_per_candidate: 32

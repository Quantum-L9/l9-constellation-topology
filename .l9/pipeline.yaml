pipeline_id: foundational-repository-intelligence
version: 1.0.0
stages:
  - id: compile-repository-model
    target_repo: Quantum-L9/l9-meta-injector
    output_packet_type: l9.repository-model
  - id: compile-topology
    target_repo: Quantum-L9/l9-constellation-topology
    depends_on: [compile-repository-model]
    requires:
      packet_type: l9.repository-model
      validation_status: passed
    output_packet_type: l9.topology
  # ADR-0021 internalized publication planning. The stage still consumes a
  # validated Topology Packet, but it now runs inside this repository and emits a
  # publication plan. Durable admission remains owned by l9-graphiti-memory.
  - id: plan-publication
    target_repo: Quantum-L9/l9-constellation-topology
    depends_on: [compile-topology]
    requires:
      packet_type: l9.topology
      validation_status: passed
    output_packet_type: l9.topology-publication-plan

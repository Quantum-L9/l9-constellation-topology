id: foundational-callback-policy
version: 1.0.0
callbacks:
  topology-control-plane:
    url_env: L9_CONTROL_API_URL
    credential_env: L9_CALLBACK_TOKEN
    credential_required: true
    allowed_path_prefix: /
    allow_loopback: false
  local-integration-test:
    url_env: L9_TEST_CALLBACK_URL
    credential_required: false
    allowed_path_prefix: /callback
    allow_loopback: true
